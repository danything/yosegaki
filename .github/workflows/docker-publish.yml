name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k3s/**'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # main に直接コミットして ArgoCD に拾わせる。同じ行を書き換えるので rebase では
      # 直らず、取り直して sed し直す
      - name: Update deployment image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            sed -i "s#image: ${REGISTRY}/[^:[:space:]]*/yosegaki:[^[:space:]]*#image: ${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}#" k3s/deployment.yaml
            if git diff --quiet -- k3s/deployment.yaml; then
              echo "already points at ${GITHUB_SHA}"
              exit 0
            fi
            git add k3s/deployment.yaml
            git commit -m "chore: update yosegaki image to ${GITHUB_SHA}"
            git push origin HEAD:main && exit 0
          done
          exit 1
