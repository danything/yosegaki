image:
  repository: ghcr.io/danything/yosegaki
  # 省略時は Chart の appVersion (= ビルドしたコミット SHA)
  tag: ""

# 公開するホスト名。空なら入口 (Ingress / HTTPRoute) を作らない
host: ""

# 入口は Gateway API の HTTPRoute か、標準の Ingress のどちらか (両方は要らない)。
# **新しく組むなら httpRoute。** Ingress API は凍結済みで、以後の機能は Gateway API 側に入る
httpRoute:
  enabled: false
  # **付け先の Gateway。省略できない** (HTTPRoute は自分では待ち受けを持たない)。
  # sectionName はリスナー名。ホスト名の段数ごとにリスナーが分かれている構成では、
  # 名前ごとに parentRef を分ける (例: *.example.com と *.lan.example.com)
  parentRefs: []
  #  - name: my-gateway
  #    namespace: gateway-system
  #    sectionName: https
  # 空なら上の host をそのまま使う (両方書く必要はない)
  hostnames: []
  annotations: {}

# 既定は Ingress のまま。既定値は Traefik 向けなので、他の controller なら className と
# annotations を差し替える (証明書の出し方が controller ごとに違う)
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: mydnschallenge
  tls: true

# 埋め込みを許すオリジン。空のままだと起動しない
allowedOrigins: []
# 誰でも埋め込めることを承知で allowedOrigins を空のまま動かすとき
allowAnyOrigin: false
siteName: yosegaki
# none: 承認なしで公開 / links: リンクが多いものだけ承認待ち / all: 全部承認待ち
moderation: none
admin:
  name: admin
  # 新着のメールを受け取る。空なら送らない
  email: ""
# 管理者は OIDC でだけログインできる。clientSecret は existingSecret の oidc-client-secret。
# adminGroups は groups / roles クレームに含まれる値 (Entra ならグループの Object ID)、
# admins は email / preferred_username / sub。どちらも空なら誰も通らない
oidc:
  issuer: ""          # 例: https://login.microsoftonline.com/<tenant>/v2.0
  clientId: ""
  adminGroups: []
  admins: []
  label: SSO          # ボタンの表示 (「〜 でログイン」)
# Cloudflare Turnstile の site key (公開値)。secret は existingSecret の turnstile-secret
turnstile:
  siteKey: ""
smtp:
  host: ""
  port: 587
  user: ""
  from: ""
  secure: false
# 接続元 IP を取るヘッダ。Cloudflare 配下なら CF-Connecting-IP
clientIpHeader: CF-Connecting-IP
# そのまま container.env に足す (name/value の配列)。README の環境変数表を参照
extraEnv: []

# 秘密を持つ Secret。キー: secret, oidc-client-secret, smtp-password, turnstile-secret。
# どれも無くても起動はする (oidc-client-secret が無いと管理機能が無効、secret が無いと
# 再起動で管理者がログアウトする)
existingSecret: yosegaki-secrets

# Secret を Infisical 純正 operator で引く場合。無効なら existingSecret を別の手段で用意する
infisicalSecret:
  enabled: false
  hostAPI: http://infisical.infisical.svc:8080/api
  identityId: ""
  serviceAccount:
    name: infisical-auth
    namespace: infisical
  projectSlug: ""
  envSlug: prod
  # Infisical 側のフォルダ。中のシークレット名がそのまま Secret のキーになる
  path: ""            # 例: /yosegaki/yosegaki-secrets

# SQLite の置き場
persistence:
  enabled: true
  size: 1Gi
  # 空なら既定の StorageClass
  storageClass: ""
  # 既存の PVC を使うならその名前
  existingClaim: ""

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi
