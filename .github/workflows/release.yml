name: Release (image + chart)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # チャートは OCI で同じ ghcr に置く。バージョンは 0.1.<run_number> で単調増加、
      # appVersion = コミット SHA (イメージの既定タグになる)
      - name: Package and push chart
        run: |
          helm package charts/yosegaki \
            --version "0.1.${{ github.run_number }}" \
            --app-version "${{ github.sha }}"
          helm push "yosegaki-0.1.${{ github.run_number }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"
          echo "chart: oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/yosegaki version 0.1.${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
        env:
          HELM_REGISTRY_CONFIG: /home/runner/.docker/config.json
