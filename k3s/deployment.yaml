apiVersion: apps/v1
kind: Deployment
metadata:
  name: yosegaki
  namespace: yosegaki
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  # SQLite を 1 つの PVC に持つので、書き手は常に 1 Pod
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: yosegaki
  template:
    metadata:
      labels:
        app: yosegaki
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: yosegaki
          image: ghcr.io/danything/yosegaki:d320e2253e90ad47b466151f753df4ac014d6225
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 6
          env:
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            - name: HOST_HEADER
              value: x-forwarded-host
            - name: CLIENT_IP_HEADER
              value: CF-Connecting-IP
            - name: SITE_NAME
              value: doany.io
            - name: ALLOWED_ORIGINS
              value: https://doany.io
            - name: ADMIN_NAME
              value: ruk
            - name: ADMIN_EMAIL
              value: info@doany.io
            - name: MODERATION
              value: links
            - name: SMTP_HOST
              value: smtp.office365.com
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USER
              value: info@doany.io
            - name: SMTP_FROM
              value: info@doany.io
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yosegaki-secrets
                  key: admin-password
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: yosegaki-secrets
                  key: secret
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: yosegaki-secrets
                  key: smtp-password
                  optional: true
          volumeMounts:
            - name: db
              mountPath: /usr/src/app/data
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: yosegaki-db
