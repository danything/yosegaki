# Secret yosegaki-secrets は Infisical (il.doany.io) のフォルダ /yosegaki/yosegaki-secrets にあり、
# Infisical 純正 operator (bootstrap/infisical-operator) が Secret にする。
# 必要なキー: admin-password, secret (トークン署名用の乱数), smtp-password
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: yosegaki-secrets
  namespace: yosegaki
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: k3s-cluster
        envSlug: prod
        secretsPath: /yosegaki/yosegaki-secrets
        recursive: false
  managedKubeSecretReferences:
    - secretName: yosegaki-secrets
      secretNamespace: yosegaki
      creationPolicy: Orphan
