name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun i --frozen-lockfile
      - run: bun run build:widget
      - run: bun run lint
      - run: bunx svelte-kit sync && bunx svelte-check --tsconfig ./tsconfig.json --tsgo
      - run: bun test
      - run: helm lint charts/yosegaki
