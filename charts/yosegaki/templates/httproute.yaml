{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.enabled なら httpRoute.parentRefs が要る (付け先の Gateway)" }}
{{- end }}
{{- $hostnames := .Values.httpRoute.hostnames | default (compact (list .Values.host)) }}
# Gateway API の HTTPRoute。証明書は Gateway 側のリスナーが持つので、
# ここでは指定しない (Ingress の tls に相当するものが無い)。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with $hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}
          port: 3000
{{- end }}
