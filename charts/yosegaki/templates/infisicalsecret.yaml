{{- if .Values.infisicalSecret.enabled }}
# Infisical のフォルダ配下をそのまま Secret のキーにする (名前 = キー)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ .Values.existingSecret }}
  namespace: {{ .Release.Namespace }}
spec:
  hostAPI: {{ .Values.infisicalSecret.hostAPI }}
  authentication:
    kubernetesAuth:
      identityId: {{ required "infisicalSecret.identityId が必要です" .Values.infisicalSecret.identityId }}
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: {{ .Values.infisicalSecret.serviceAccount.name }}
        namespace: {{ .Values.infisicalSecret.serviceAccount.namespace }}
      secretsScope:
        projectSlug: {{ required "infisicalSecret.projectSlug が必要です" .Values.infisicalSecret.projectSlug }}
        envSlug: {{ .Values.infisicalSecret.envSlug }}
        secretsPath: {{ required "infisicalSecret.path が必要です" .Values.infisicalSecret.path | quote }}
        recursive: false
  managedKubeSecretReferences:
    - secretName: {{ .Values.existingSecret }}
      secretNamespace: {{ .Release.Namespace }}
      # Orphan: CR を消しても Secret は残す (再作成で稼働中の Pod を巻き込まない)
      creationPolicy: Orphan
{{- end }}
